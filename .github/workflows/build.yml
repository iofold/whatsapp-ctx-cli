name: Build & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp-sync/go.mod
          cache-dependency-path: whatsapp-sync/go.sum
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Go vet + tests
        working-directory: whatsapp-sync
        run: |
          go vet ./...
          go test ./...
      - name: Python tests
        run: |
          uv sync --locked
          uv run pytest tests/ -q

  # Linux binaries are built inside PyPA manylinux_2_28 containers (glibc 2.28) so they run
  # on any distro the wheel tag promises. Built on ubuntu-latest (26.04) they needed glibc 2.43.
  build-go-linux:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            goarch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp-sync/go.mod
          cache-dependency-path: whatsapp-sync/go.sum

      - name: Build Go binary
        env:
          CGO_ENABLED: "1"
        run: |
          # The checkout is owned by the runner user, not the container's root; without this
          # git refuses the repo and Go's VCS stamping fails ("error obtaining VCS status").
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd whatsapp-sync
          go build -o "../wactx/bin/whatsapp-sync-linux-${{ matrix.goarch }}" .

      - name: Check glibc floor (must stay <= 2.28 for the manylinux_2_28 tag)
        run: |
          BIN="wactx/bin/whatsapp-sync-linux-${{ matrix.goarch }}"
          NEED=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "$BIN requires $NEED"
          [ "$(printf '%s\nGLIBC_2.28\n' "$NEED" | sort -V | tail -1)" = "GLIBC_2.28" ]
          "$BIN" analytics -db /tmp/smoke.duckdb > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: wactx/bin/whatsapp-sync-*

  build-go:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp-sync/go.mod
          cache-dependency-path: whatsapp-sync/go.sum

      - name: Build Go binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          # Without this the binary inherits the runner SDK's macOS version (26.0).
          # 12.0 is Go 1.26's floor; DuckDB's static library targets 11.0.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cd whatsapp-sync
          BINARY_NAME="whatsapp-sync-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -o "../wactx/bin/${BINARY_NAME}" .
          ls -lh "../wactx/bin/${BINARY_NAME}"

      - name: Check macOS floor (must stay 12.0 for the macosx_12_0 tag)
        if: matrix.goos == 'darwin'
        run: |
          BIN="wactx/bin/whatsapp-sync-darwin-${{ matrix.goarch }}"
          MINOS=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && $1=="minos"{print $2; exit}')
          echo "$BIN minos $MINOS"
          [ "$MINOS" = "12.0" ]

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wactx/bin/whatsapp-sync-*

  build-wheels:
    needs: [build-go, build-go-linux]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_2_28_x86_64
            go_artifact: binary-linux-amd64
          - os: ubuntu-latest
            platform: manylinux_2_28_aarch64
            go_artifact: binary-linux-arm64
          - os: macos-latest
            platform: macosx_12_0_x86_64
            go_artifact: binary-darwin-amd64
          - os: macos-latest
            platform: macosx_12_0_arm64
            go_artifact: binary-darwin-arm64
          - os: windows-latest
            platform: win_amd64
            go_artifact: binary-windows-amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.go_artifact }}
          path: wactx/bin/

      - name: Make binary executable
        if: matrix.os != 'windows-latest'
        run: chmod +x wactx/bin/*

      - name: Also copy as generic name
        shell: bash
        run: |
          cd wactx/bin
          for f in whatsapp-sync-*; do
            if [ "$f" != "whatsapp-sync" ] && [ "$f" != "whatsapp-sync.exe" ]; then
              cp "$f" "whatsapp-sync${f##*sync-*-*}"  2>/dev/null || cp "$f" whatsapp-sync
            fi
          done
          ls -la

      - name: Build wheel
        shell: bash
        run: |
          pip install build setuptools setuptools-scm wheel
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          fi
          python -m build --wheel

      - name: Rename wheel for platform
        shell: bash
        run: |
          cd dist
          for whl in *.whl; do
            new_name=$(echo "$whl" | sed "s/py3-none-any/py3-none-${{ matrix.platform }}/")
            if [ "$new_name" != "$whl" ]; then
              mv "$whl" "$new_name"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
