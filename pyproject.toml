[project]
name = "whatsapp-ctx-cli"
dynamic = ["version"]
description = "Semantic + graph search over your WhatsApp messages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    # duckdb 2.0 breaks BM25 search (binder error on the score alias) and HNSW index use.
    "duckdb>=1.5,<2",
    "igraph>=0.11",
    "scipy>=1.12",
    "openai>=1.0",
    "pytz",
    "rich>=13.0",
    # 3.8.18 is the first release tested here on Python 3.14 (older ones crash in confection).
    "spacy>=3.8.18",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
wactx = "wactx.cli:main"

[dependency-groups]
dev = [
    "networkx>=3.0",  # reference implementation for tests/test_graph_search.py only
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# The spaCy model is not on PyPI, so it cannot be a published dependency (PyPI rejects
# direct-URL requirements). Kept as a default group for local checkouts; wheel users
# install it separately (see README). enrich falls back to regex + blank spaCy without it.
ner = [
    "en-core-web-sm>=3.7",
]

[tool.uv]
default-groups = ["dev", "ner"]

[tool.setuptools.packages.find]
include = ["wactx*"]

[tool.setuptools.package-data]
wactx = ["bin/*"]

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
